<style>
/* VOICE: a friendly classroom quiz, lively but tidy
   IDEA: the wall map of France in a schoolroom, a teacher pointing at one department
   PICTURE: the live map itself, zoomed on the department being asked
   COLOUR and TYPE: sea blue ground, sand land, tricolore red target, deep blue found; Fraunces + Instrument Sans
   LAYOUT: modest title strip, map large at left, question card at right; stacks map then card on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f4f7fb,#0e1726);--ink:light-dark(#141b2b,#eef2f8);--soft:light-dark(#5b6579,#9aa6bb);
--sea:linear-gradient(160deg,#cfe9fb,#9fd0f0);--land:#f3ead6;--edge:#ffffff;
--card:light-dark(#ffffff,#16223a);--line:light-dark(#dfe5ee,#26344f);
--red:#e1000f;--blue:light-dark(#1d3fc4,#6f8cff);--found:light-dark(#2f55e6,#4f70f0);--miss:#f08a24;--bad:light-dark(#b3001b,#ff6b7a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:18px max(4vw,16px) 10px;max-width:1280px;margin:auto}
h1{font:700 clamp(26px,3.4vw,38px)/1.05 Fraunces,Georgia,serif;margin:0;text-wrap:balance}
h1 span{color:var(--red)}
.stats{display:flex;gap:18px;font-size:14px;color:var(--soft)}
.stats b{display:block;font:600 22px/1.1 Fraunces,Georgia,serif;color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;padding:6px max(4vw,16px) 32px;max-width:1280px;margin:auto;align-items:start}
.mapbox{background:var(--sea);border-radius:18px;position:relative;overflow:hidden;aspect-ratio:1/0.92;box-shadow:inset 0 0 0 1px var(--line)}
#map{position:absolute;inset:0;width:100%;height:100%;transition:none}
#map path{fill:var(--land);stroke:var(--edge);stroke-width:1.1;vector-effect:non-scaling-stroke;transition:fill .25s}

"]{fill:#9fd6d0}#map path[data-c="27"]{fill:#9fd6d0}#map path[data-c="50"]{fill:#9fd6d0}#map path[data-c="61"]{fill:#9fd6d0}#map path[data-c="76"]{fill:#9fd6d0}#map path[data-c="16"]{fill:#c8e39e}#map path[data-c="17"]{fill:#c8e39e}#map path[data-c="19"]{fill:#c8e39e}#map path[data-c="23"]{fill:#c8e39e}#map path[data-c="24"]{fill:#c8e39e}#map path[data-c="33"]{fill:#c8e39e}#map path[data-c="40"]{fill:#c8e39e}#map path[data-c="47"]{fill:#c8e39e}#map path[data-c="64"]{fill:#c8e39e}#map path[data-c="79"]{fill:#c8e39e}#map path[data-c="86"]{fill:#c8e39e}#map path[data-c="87"]{fill:#c8e39e}#map path[data-c="09"]{fill:#f3b4cf}#map path[data-c="11"]{fill:#f3b4cf}#map path[data-c="12"]{fill:#f3b4cf}#map path[data-c="30"]{fill:#f3b4cf}#map path[data-c="31"]{fill:#f3b4cf}#map path[data-c="32"]{fill:#f3b4cf}#map path[data-c="34"]{fill:#f3b4cf}#map path[data-c="46"]{fill:#f3b4cf}#map path[data-c="48"]{fill:#f3b4cf}#map path[data-c="65"]{fill:#f3b4cf}#map path[data-c="66"]{fill:#f3b4cf}#map path[data-c="81"]{fill:#f3b4cf}#map path[data-c="82"]{fill:#f3b4cf}#map path[data-c="44"]{fill:#b7c9f0}#map path[data-c="49"]{fill:#b7c9f0}#map path[data-c="53"]{fill:#b7c9f0}#map path[data-c="72"]{fill:#b7c9f0}#map path[data-c="85"]{fill:#b7c9f0}#map path[data-c="04"]{fill:#ffd9a0}#map path[data-c="05"]{fill:#ffd9a0}#map path[data-c="06"]{fill:#ffd9a0}#map path[data-c="13"]{fill:#ffd9a0}#map path[data-c="83"]{fill:#ffd9a0}#map path[data-c="84"]{fill:#ffd9a0}#map path[data-c="971"]{fill:#c5e8c0}#map path[data-c="972"]{fill:#c5e8c0}#map path[data-c="973"]{fill:#c5e8c0}#map path[data-c="974"]{fill:#c5e8c0}#map path[data-c="976"]{fill:#c5e8c0}
#map path.t{fill:var(--red)!important}
#map path.f{fill:var(--found)!important}
#map path.m{fill:var(--miss)!important}
#map path.w{fill:var(--bad)!important;opacity:.55}
.easy #map path:not(.t):not(.f){cursor:pointer}
.easy #map path:not(.t):not(.f):hover{fill:#ffe066!important}
#map text{font:600 13px "Instrument Sans",sans-serif;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translate(-50%,-130%)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.zoom button{background:var(--card);color:var(--ink);border:1px solid var(--line);font:500 14px inherit;font-family:inherit;padding:8px 12px;border-radius:10px;cursor:pointer;min-height:40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
/* panneau de questions clair et gai */
.card,.zoom{--card:#ffffff;--bg:#ffffff;--ink:#1d2433;--soft:#5b6579;--line:#f0d9a8;--blue:#1d3fc4;--found:#2f55e6;--bad:#c8102e}
.card{background:linear-gradient(160deg,#fffaf0,#ffefc9);border:2px solid #f2c230;box-shadow:0 8px 24px rgba(0,0,0,.25);color:var(--ink)}
.card input{background:#fff}
.card .modes button[aria-pressed=true]{background:#1d3fc4!important;border-color:#1d3fc4!important;color:#fff!important}
.ask{font-size:15px;color:var(--soft);margin:0 0 4px}
.target{font:700 clamp(28px,3.2vw,40px)/1.05 Fraunces,Georgia,serif;margin:0 0 14px;text-wrap:balance}
.target small{display:block;font:600 16px "Instrument Sans",sans-serif;color:var(--red);margin-bottom:4px}
.progress{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:14px}
.bar{flex:1;height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--found);transition:width .3s}
.field{position:relative}
input{width:100%;font:16px inherit;font-family:inherit;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px light-dark(#d5ddfb,#22336b)}
.sugg{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-height:0}
.sugg button{font:14px inherit;font-family:inherit;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;min-height:36px}
.msg{min-height:24px;margin:12px 0 6px;font-weight:500}
.msg.ok{color:var(--found)}.msg.no{color:var(--bad)}.msg.win{color:var(--found);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 16px;padding:0;list-style:none}
.chips li{font-size:14px;padding:5px 10px;border-radius:999px;color:#fff}
.chips .f{background:var(--found)}.chips .m{background:var(--miss)}.chips .w{background:transparent;color:var(--bad);border:1px solid var(--bad);text-decoration:line-through}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px inherit;font-family:inherit;padding:12px 18px;border-radius:12px;border:0;cursor:pointer;min-height:46px}
.primary{background:var(--red);color:#fff}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.modes{display:flex;gap:6px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center;font-size:14px;color:var(--soft)}
.modes button{font:500 14px inherit;font-family:inherit;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-height:36px}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.help{font-size:14px;color:var(--soft);margin:10px 0 0}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr)}.card{padding:18px}}
.emb body{background:transparent}.emb h1{display:none}.emb header{justify-content:flex-end;padding-top:4px}.emb main,.emb header{padding-left:0;padding-right:0}
</style>
</head>
<body class="easy">
<header>
  <h1>Le jeu des <span>départements</span></h1>
  <div class="stats">
    <div><b id="sScore">0</b>points</div>
    <div><b id="sRounds">0</b>manches</div>
    <div><b id="sBest">0</b>record</div>
  </div>
</header>
<main>
  <div>
    <div class="mapbox">
      <svg id="map" viewBox="0 0 1000 965" role="img" aria-label="Carte des départements de France"></svg>
      <div id="tip"></div>
      <div class="zoom"><button id="zoomBtn" type="button">Voir toute la France</button></div>
    </div>
  </div>
  <section class="card" aria-live="polite">
    <p class="ask">Quels départements touchent…</p>
    <h2 class="target" id="target"></h2>
    <div class="progress"><span id="count"></span><div class="bar"><i id="bar"></i></div></div>
    <form id="form" class="field" autocomplete="off">
      <label for="answer" class="ask">Tapez un nom ou un numéro</label>
      <input id="answer" type="text" placeholder="ex. Isère ou 38" enterkeyhint="done">
      <ul class="sugg" id="sugg"></ul>
    </form>
    <p class="msg" id="msg"></p>
    <ul class="chips" id="chips"></ul>
    <div class="actions">
      <button class="btn ghost" id="reveal" type="button">Voir la réponse</button>
      <button class="btn primary" id="next" type="button">Département suivant</button>
    </div>
    <div class="modes">
      <span>Niveau :</span>
      <button type="button" data-mode="easy" aria-pressed="true">Facile</button>
      <button type="button" data-mode="hard" aria-pressed="false">Difficile</button>
    </div>
    <p class="help" id="help">Facile : touchez la carte pour répondre, le nom s'affiche au survol.</p>
  </section>
</main>

{
const NS='http://www.w3.org/2000/svg';
const map=document.getElementById('map'),tip=document.getElementById('tip');
const $=id=>document.getElementById(id);
const byCode={};DEPS.forEach(d=>byCode[d.c]=d);
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\bst\b/g,'saint').replace(/[^a-z0-9]/g,'');
DEPS.forEach(d=>{d.k=norm(d.n);d.cx=(d.b[0]+d.b[2])/2;d.cy=(d.b[1]+d.b[3])/2});
const LBL={'75':[0,0],'92':[0,0],'93':[0,0],'94':[0,0]};
let mode='easy',cur=null,found=new Set(),wrong=new Set(),done=false,score=0,rounds=0,best=0,full=false,deck=[];
try{best=+localStorage.getItem('dep-best')||0}catch(e){}
map.innerHTML=DEPS.map(d=>`<path id="p${d.c}" data-c="${d.c}" d="${d.d}"/>`).join('')+'<g id="labels"></g>';

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(){if(!deck.length)deck=shuffle(DEPS.filter(d=>d.v.length).map(d=>d.c));return byCode[deck.pop()]}

function view(){
  let b;
  if(full){b=[0,0,1000,965]}else{
    const ds=[cur,...cur.v.map(c=>byCode[c])];
    b=[Math.min(...ds.map(d=>d.b[0])),Math.min(...ds.map(d=>d.b[1])),Math.max(...ds.map(d=>d.b[2])),Math.max(...ds.map(d=>d.b[3]))];
    let w=b[2]-b[0],h=b[3]-b[1];const pad=Math.max(w,h)*0.35+20;
    b=[b[0]-pad,b[1]-pad,b[2]+pad,b[3]+pad];w=b[2]-b[0];h=b[3]-b[1];
    const r=1000/965;if(w/h<r){const nw=h*r;b[0]-=(nw-w)/2;b[2]=b[0]+nw}else{const nh=w/r;b[1]-=(nh-h)/2;b[3]=b[1]+nh}
  }
  map.setAttribute('viewBox',`${b[0]} ${b[1]} ${b[2]-b[0]} ${b[3]-b[1]}`);
  $('zoomBtn').textContent=full?'Zoomer sur la question':'Voir toute la France';
  drawLabels(b);
}
function drawLabels(b){
  const sc=(b[2]-b[0])/1000;
  const show=[cur,...[...found].map(c=>byCode[c]),...(done?cur.v.filter(c=>!found.has(c)).map(c=>byCode[c]):[])];
  $('labels').innerHTML=show.map(d=>`<text x="${d.cx}" y="${d.cy}" style="font-size:${(full?14:15)*sc*1.6}px;stroke-width:${3*sc*1.6}px">${d.c}</text>`).join('');
}
function paint(){
  DEPS.forEach(d=>{const p=$('p'+d.c);p.setAttribute('class',d===cur?'t':found.has(d.c)?'f':(done&&cur.v.includes(d.c))?'m':wrong.has(d.c)?'w':'')});
  const n=cur.v.length;$('count').textContent=`${found.size} / ${n}`;$('bar').style.width=(found.size/n*100)+'%';
  $('chips').innerHTML=[...cur.v.filter(c=>found.has(c)).map(c=>`<li class="f">${c} · ${byCode[c].n}</li>`),
    ...(done?cur.v.filter(c=>!found.has(c)).map(c=>`<li class="m">${c} · ${byCode[c].n}</li>`):[]),
    ...[...wrong].map(c=>`<li class="w">${c} · ${byCode[c].n}</li>`)].join('');
  $('sScore').textContent=score;$('sRounds').textContent=rounds;$('sBest').textContent=best;
  $('reveal').disabled=done;$('reveal').style.opacity=done?.4:1;
  view();
}
function say(t,c){const m=$('msg');m.textContent=t;m.className='msg '+(c||'')}
function newRound(){
  cur=pick();found=new Set();wrong=new Set();done=false;full=false;
  $('target').innerHTML=`<small>${cur.c}</small>${cur.n}`;
  say(`Il y en a ${cur.v.length}. À vous !`);$('answer').value='';$('sugg').innerHTML='';paint();
}
function finish(win){
  if(done)return;done=true;rounds++;
  if(win){score+=2;say(found.size===cur.v.length&&!wrong.size?'Parfait, sans faute ! +2 points bonus':'Bravo, vous les avez tous trouvés ! +2 points bonus','win')}
  else say(`En orange, ceux qui manquaient (${cur.v.length-found.size}).`,'no');
  if(score>best){best=score;try{localStorage.setItem('dep-best',best)}catch(e){}}
  paint();
}
function answer(d){
  if(done||!d)return;
  if(d===cur){say(`C'est le département de la question !`,'no');return}
  if(found.has(d.c)||wrong.has(d.c)){say(`${d.n} : déjà proposé.`);return}
  if(cur.v.includes(d.c)){found.add(d.c);score++;say(`Oui ! ${d.n} touche bien ${cur.n}.`,'ok');
    if(found.size===cur.v.length){paint();finish(true);return}}
  else{wrong.add(d.c);score=Math.max(0,score-1);say(`Non, ${d.n} ne touche pas ${cur.n}. −1 point`,'no');
    const c=document.querySelector('.card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
  paint();
}
function matches(q){
  const k=norm(q);if(!k)return[];
  if(/^\d+[ab]?$/.test(k)){const c=k.length===1?'0'+k:k.toUpperCase();return DEPS.filter(d=>d.c.startsWith(c)||d.c===c)}
  const st=DEPS.filter(d=>d.k.startsWith(k)),inn=DEPS.filter(d=>!d.k.startsWith(k)&&d.k.includes(k));return[...st,...inn];
}
$('answer').addEventListener('input',e=>{
  const m=matches(e.target.value).slice(0,6);
  $('sugg').innerHTML=m.map(d=>`<li><button type="button" data-c="${d.c}">${d.c} · ${d.n}</button></li>`).join('');
});
$('sugg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;answer(byCode[b.dataset.c]);$('answer').value='';$('sugg').innerHTML='';$('answer').focus()});
$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('answer').value;const k=norm(v);if(!k)return;
  const exact=DEPS.find(d=>d.k===k||d.c.toLowerCase()===k||d.c===('0'+k));const m=exact||matches(v)[0];
  if(!m){say(`Je ne connais pas « ${v} ».`,'no');return}
  answer(m);$('answer').value='';$('sugg').innerHTML=''});
map.addEventListener('click',e=>{if(mode!=='easy')return;const p=e.target.closest('path');if(p)answer(byCode[p.dataset.c])});
map.addEventListener('mousemove',e=>{
  const p=e.target.closest('path');
  if(!p||mode!=='easy'){tip.style.opacity=0;return}
  const r=map.parentNode.getBoundingClientRect();const d=byCode[p.dataset.c];
  tip.textContent=`${d.c} · ${d.n}`;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.style.opacity=1});
map.addEventListener('mouseleave',()=>tip.style.opacity=0);
$('zoomBtn').addEventListener('click',()=>{full=!full;view()});
$('reveal').addEventListener('click',()=>finish(false));
$('next').addEventListener('click',()=>{if(!done&&cur&&found.size)rounds++;newRound();$('answer').focus({preventScroll:true})});
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode;document.body.className=mode;
  document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('help').textContent=mode==='easy'?"Facile : touchez la carte pour répondre, le nom s'affiche au survol.":'Difficile : pas de noms sur la carte, il faut taper les réponses de tête.';
  tip.style.opacity=0}));
newRound();
}
