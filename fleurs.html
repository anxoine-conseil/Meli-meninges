<body>
<h1 class="flower-title">Les mots en fleurs</h1>
<div class="mode" role="group" aria-label="Mode de jeu">
  <button data-mode="ecrire" aria-pressed="false">Écrire avec les fleurs</button>
  <button data-mode="secret" aria-pressed="false">Le message secret</button>
  <button data-mode="abc" aria-pressed="true">L'abécédaire</button>
</div>

<div id="play" class="hidden">
  <div class="bar"><b>Niveau</b><div class="seg" id="lv"></div></div>
  <div class="stats"><span>Mot <b id="nW">1</b> / 5</span><span><b id="pts">0</b> points</span></div>
  <div class="target">
    <p class="ask" id="ask"></p>
    <div class="word" id="word"></div>
    <div class="guess hidden" id="guessBox"><input id="guess" autocomplete="off" aria-label="Votre réponse" placeholder="Votre réponse"><button class="big" id="guessBtn">Valider</button></div>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div class="actions">
    <button class="ghost" id="hintBtn">Un indice</button>
    <button class="ghost" id="clearBtn">Effacer la dernière fleur</button>
    <button class="big" id="nextBtn">Mot suivant</button>
  </div>
  <div class="tray" id="tray" style="--t:78px"></div>
  <p class="note" id="note"></p>
</div>

<div id="abcView">
  <p class="ask">Les fleurs de A à Z. Survolez ou touchez une photo pour la voir en grand.</p>
  <div class="abc" id="abc"></div>
</div>
<figure class="photo-zoom hidden" id="photoZoom" aria-hidden="true">
  <img id="photoZoomImage" alt="">
  <figcaption id="photoZoomName"></figcaption>
</figure>
