:root{color-scheme:light dark;
--bg:light-dark(#f4f7fb,#0e1726);--ink:light-dark(#141b2b,#eef2f8);--soft:light-dark(#5b6579,#9aa6bb);
--sea:linear-gradient(160deg,#cfe9fb,#9fd0f0);--edge:#ffffff;--line:light-dark(#dfe5ee,#26344f);
--red:#e1000f;--ok:#1d9a5b;--bad:#c8102e;--gold:#f2c230}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #1d3fc4;outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:18px max(4vw,16px) 10px;max-width:1280px;margin:auto}
h1{font:700 clamp(26px,3.4vw,38px)/1.05 Fraunces,Georgia,serif;margin:0}
h1 span{color:var(--red)}
.stats{display:flex;gap:18px;font-size:14px;color:var(--soft)}
.stats b{display:block;font:600 22px/1.1 Fraunces,Georgia,serif;color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-areas:"map card" "map opts";grid-template-rows:auto 1fr;gap:16px 20px;padding:6px max(4vw,16px) 32px;max-width:1280px;margin:auto;align-items:start}
.mapcol{grid-area:map}#panel{grid-area:card}.optsCard{grid-area:opts;align-self:start;padding:14px 20px}
.mapbox{background:var(--sea);border-radius:18px;position:relative;overflow:hidden;aspect-ratio:1/0.92;box-shadow:inset 0 0 0 1px var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
#map{position:absolute;inset:0;width:100%;height:100%}
#map path{stroke:var(--edge);stroke-width:1.1;vector-effect:non-scaling-stroke;transition:fill .25s,opacity .25s;cursor:pointer}
#map path.off{opacity:.28;cursor:default}
#map path.cand{fill:#ffe066!important;stroke:#8a6a00;stroke-width:2.4}
#map path:not(.off):not(.good):not(.miss):hover{fill:#ffd23f!important}
#map path.drop{fill:#ffd23f!important}
#map path.good{fill:var(--ok)!important}
#map path.miss{fill:var(--bad)!important;opacity:1}
#map path.near{fill:#f08a24!important}
#map text{font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.55);pointer-events:none;text-anchor:middle;dominant-baseline:middle}
#tip{position:absolute;pointer-events:none;background:#141b2b;color:#fff;font-size:13px;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;transform:translate(-50%,-140%)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.zoom button{background:#fff;color:#1d2433;border:1px solid #cfd8e3;font-weight:600;min-width:44px;min-height:44px;padding:0 12px;border-radius:10px}
.card{--ink:#1d2433;--soft:#5b6579;--line:#f0d9a8;background:linear-gradient(160deg,#fffaf0,#ffefc9);border:2px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.25);color:var(--ink);border-radius:18px;padding:20px}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--soft);margin-bottom:12px}
.bar{flex:1;height:8px;background:#f3dfb0;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#1d3fc4;transition:width .3s}
.token{display:flex;gap:14px;align-items:center;background:#fff;border:2px solid #e8cf8c;border-radius:16px;padding:14px;touch-action:none;cursor:grab;box-shadow:0 3px 0 #e8cf8c}
.token:active{cursor:grabbing}
.cphoto{margin:0 0 12px;border-radius:14px;overflow:hidden;background:#efe3c4;border:2px solid #e8cf8c;position:relative}
.cphoto img{display:block;width:100%;height:clamp(140px,24vh,230px);object-fit:cover;object-position:center 30%}
.cphoto.portrait img{object-fit:contain;background:#efe3c4}
.cphoto figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 5px;font-size:11.5px;line-height:1.3;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62));text-shadow:0 1px 2px #000}
.cphoto figcaption a{color:#fff}
.ico{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff}
.ico svg{width:30px;height:30px}
.t-m .ico{background:#1d3fc4}.t-p .ico{background:#b5179e}.t-h .ico{background:#7a4b16}.t-s .ico{background:#e07b00}
.kind{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700;color:var(--soft);margin-bottom:2px}
.kind .now{background:#1d9a5b;color:#fff;border-radius:999px;padding:0 8px}
.title{font:700 clamp(22px,2.4vw,28px)/1.1 Fraunces,Georgia,serif;margin:0;text-wrap:balance}
.hint{font-size:17px;margin:14px 0 4px}
.drag-help{font-size:14px;color:var(--soft);margin:0 0 6px}
.msg{min-height:26px;margin:12px 0 4px;font-weight:700}
.msg.ok{color:var(--ok)}.msg.no{color:var(--bad)}.msg.near{color:#b85c00}
.explain{background:#fff;border-left:4px solid #1d3fc4;border-radius:10px;padding:10px 14px;margin:8px 0 4px}
.explain[hidden]{display:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font-weight:700;padding:12px 18px;border-radius:12px;border:0;min-height:48px;font-size:16px}
.primary{background:var(--red);color:#fff}
.ghost{background:transparent;border:1.5px solid #d9bf7e}
.btn[hidden]{display:none}
.opts{display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--soft)}
.row span{min-width:4.6em}
.row button{font-size:14px;font-weight:600;padding:8px 13px;border-radius:999px;border:1px solid #d9bf7e;background:transparent;color:var(--ink);min-height:40px}
.row button[aria-pressed=true]{background:#1d3fc4;border-color:#1d3fc4;color:#fff}
.help{font-size:14px;color:var(--soft);margin:0}
.ghostchip{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);background:#fff;border:2px solid var(--gold);border-radius:999px;padding:8px 14px 8px 8px;display:flex;gap:8px;align-items:center;font-weight:700;color:#1d2433;box-shadow:0 10px 24px rgba(0,0,0,.35);max-width:260px}
.ghostchip .ico{width:34px;height:34px}.ghostchip .ico svg{width:18px;height:18px}
.end h2{font:700 30px/1.1 Fraunces,Georgia,serif;margin:0 0 6px}
.end ol{margin:12px 0 0;padding-left:1.3em;display:grid;gap:6px}
.end li b{font-weight:700}.end li .r{font-size:14px;color:var(--soft)}
.end .ok{color:var(--ok)}.end .no{color:var(--bad)}.end .nr{color:#b85c00}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.85)}}
@media(prefers-reduced-motion:reduce){.shake,.pop{animation:none}}
@media(max-width:820px){main{grid-template-columns:minmax(0,1fr);grid-template-areas:"card" "map" "opts"}.card{padding:16px}.hint{font-size:16px;margin-top:10px}}
.emb body{background:transparent}.emb h1{display:none}.emb header{justify-content:flex-end;padding-top:4px}.emb main,.emb header{padding-left:0;padding-right:0}
</style>

<header>
  <h1>Qui est <span>où</span> ?</h1>

<main>
  <div class="mapcol">

      <svg id="map" viewBox="0 0 1000 965" role="img" aria-label="Carte des départements de France"></svg>

      <div class="zoom" id="zoom">
        <button type="button" id="zIn" aria-label="Zoomer">+</button>

<script>
{
const $=id=>document.getElementById(id);
const DEPS=window.DEPS,byCode={};DEPS.forEach(d=>{byCode[d.c]=d;d.cx=(d.b[0]+d.b[2])/2;d.cy=(d.b[1]+d.b[3])/2});
const CARDS=window.CARTES.map(([c,t,n,q,a,e],i)=>({id:i,c,t,n,q,a,e}));
const REG={
 'Hauts-de-France':['02','59','60','62','80'],'Normandie':['14','27','50','61','76'],'Bretagne':['22','29','35','56'],
 'Pays de la Loire':['44','49','53','72','85'],'Centre-Val de Loire':['18','28','36','37','41','45'],
 'Île-de-France':['75','77','78','91','92','93','94','95'],'Grand Est':['08','10','51','52','54','55','57','67','68','88'],
 'Bourgogne-Franche-Comté':['21','25','39','58','70','71','89','90'],'Nouvelle-Aquitaine':['16','17','19','23','24','33','40','47','64','79','86','87'],
 'Auvergne-Rhône-Alpes':['01','03','07','15','26','38','42','43','63','69','73','74'],'Occitanie':['09','11','12','30','31','32','34','46','48','65','66','81','82'],
 "Provence-Alpes-Côte d'Azur":['04','05','06','13','83','84'],'Corse':['2A','2B']};
const COL=['#b9d7f2','#c8e39e','#f3b4cf','#f6d38a','#d9c6ec','#ffc48a','#9fd6d0','#f2b8a0','#f5e39a','#b7c9f0','#a8d8b9','#ffd9a0','#f7a8b8'];
const regOf={};Object.entries(REG).forEach(([r,cs],i)=>cs.forEach(c=>{regOf[c]=r;byCode[c].fill=COL[i]}));
const TYPES={m:['Monument','<path d="M3 21h18M5 21V10m4 11V10m6 11V10m4 11V10M2 10h20L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'],
 p:['Personnage','<circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
 h:['Histoire','<path d="M6 3h12M6 21h12M7 3c0 5 10 5 10 9s-10 4-10 9M17 3c0 5-10 5-10 9s10 4 10 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
 s:['Le saviez-vous ?','<path d="M12 2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 16.9l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>']};
const icon=t=>`<svg viewBox="0 0 24 24" aria-hidden="true">${TYPES[t][1]}</svg>`;
const LV_HELP={1:'Facile : trois départements voisins sont proposés en jaune. 1 point par bonne réponse, deux essais.',
 2:'Moyen : la région est indiquée, à vous de trouver le département. 2 points, deux essais.',
 3:'Expert : toute la France, un seul essai. 3 points, et 1 point si vous tombez sur un voisin.'};
const P=window.parent!==window?window.parent:null;
const api=()=>{try{return P&&P.mmApi}catch(e){return null}};
const mm=(pose,t,ms)=>{try{api()?.mm(pose,t,ms)}catch(e){}};
const snd=k=>{try{api()?.[k]?.()}catch(e){}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store=(k,v)=>{try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};

let lv=store('qeo-lv')||1,er=store('qeo-er')||'all',best=store('qeo-best')||0,seen=new Set(store('qeo-seen')||[]);
let game=[],idx=0,score=0,cur=null,tries=0,done=false,results=[],allowed=null,cands=[];

// ---------- carte ----------
const map=$('map'),NS='http://www.w3.org/2000/svg';
map.innerHTML=DEPS.map(d=>`<path id="p${d.c}" data-c="${d.c}" d="${d.d}" style="fill:${d.fill}"/>`).join('')+'<g id="labels"></g>';
let vb=[0,0,1000,965],anim=null;
function setVB(b,instant){
  const r=1000/965;let [x0,y0,x1,y1]=b;let w=x1-x0,h=y1-y0;
  if(w/h<r){const nw=h*r;x0-=(nw-w)/2;w=nw}else{const nh=w/r;y0-=(nh-h)/2;h=nh}
  if(w>1100){w=1100;h=w/r}
  const to=[x0,y0,w,h];
  if(instant||matchMedia('(prefers-reduced-motion: reduce)').matches){vb=to;applyVB();return}
  const from=vb.slice(),t0=performance.now();cancelAnimationFrame(anim);
  const step=t=>{const k=Math.min(1,(t-t0)/450),e=1-Math.pow(1-k,3);vb=from.map((v,i)=>v+(to[i]-v)*e);applyVB();if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step);
}
function applyVB(){map.setAttribute('viewBox',vb.join(' '));drawLabels()}
function box(codes,padK=.35){
  const ds=codes.map(c=>byCode[c]);let b=[Math.min(...ds.map(d=>d.b[0])),Math.min(...ds.map(d=>d.b[1])),Math.max(...ds.map(d=>d.b[2])),Math.max(...ds.map(d=>d.b[3]))];
  const pad=Math.max(b[2]-b[0],b[3]-b[1])*padK+25;return [b[0]-pad,b[1]-pad,b[2]+pad,b[3]+pad];
}
let labels=[];
function drawLabels(){
  const sc=vb[2]/1000,fs=Math.max(11,15)*sc*1.5;
  $('labels').innerHTML=labels.map(([c,txt])=>{const d=byCode[c];return `<text x="${d.cx}" y="${d.cy}" style="font-size:${fs}px;stroke-width:${3.5*sc*1.5}px">${txt}</text>`}).join('');
}
function zoomBy(f,cx,cy){
  const w=vb[2]*f,h=vb[3]*f;if(w<60||w>1150)return;
  cx??=vb[0]+vb[2]/2;cy??=vb[1]+vb[3]/2;
  vb=[cx-(cx-vb[0])*f,cy-(cy-vb[1])*f,w,h];applyVB();
}
$('zIn').onclick=()=>zoomBy(.7);$('zOut').onclick=()=>zoomBy(1/.7);$('zAll').onclick=()=>setVB([0,0,1000,965]);
const svgPt=(x,y)=>{const r=map.getBoundingClientRect(),s=Math.max(vb[2]/r.width,vb[3]/r.height);
  const ox=(r.width-vb[2]/s)/2,oy=(r.height-vb[3]/s)/2;return [vb[0]+(x-r.left-ox)*s,vb[1]+(y-r.top-oy)*s]};
$('mapbox').addEventListener('wheel',e=>{e.preventDefault();const [x,y]=svgPt(e.clientX,e.clientY);zoomBy(e.deltaY<0?.85:1/.85,x,y)},{passive:false});

// glisser la carte pour se déplacer, toucher pour répondre (avec pincement à deux doigts)
const ptrs=new Map();let pan=null,pinch=null;
$('mapbox').addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoom'))return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});$('mapbox').setPointerCapture(e.pointerId);
  if(ptrs.size===1)pan={x:e.clientX,y:e.clientY,vb:vb.slice(),moved:false,target:e.target};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:vb.slice()};pan=null}
});
$('mapbox').addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const f=pinch.d/d;
    const [cx,cy]=svgPt((a.x+b.x)/2,(a.y+b.y)/2);vb=pinch.vb.slice();zoomBy(f,cx,cy);return}
  if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.hypot(dx,dy)>8)pan.moved=true;
    if(pan.moved){const r=map.getBoundingClientRect(),s=Math.max(vb[2]/r.width,vb[3]/r.height);vb=[pan.vb[0]-dx*s,pan.vb[1]-dy*s,vb[2],vb[3]];applyVB()}}
  tipAt(e);
});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(pan&&!pan.moved&&e.type==='pointerup'){const el=document.elementFromPoint(e.clientX,e.clientY);const p=el&&el.closest&&el.closest('#map path');if(p)answer(p.dataset.c)}
  if(!ptrs.size)pan=null};
$('mapbox').addEventListener('pointerup',endPtr);$('mapbox').addEventListener('pointercancel',endPtr);
$('mapbox').addEventListener('pointerleave',()=>$('tip').style.opacity=0);
function tipAt(e){
  const tip=$('tip');if(e.pointerType==='touch'||lv===3||pan&&pan.moved){tip.style.opacity=0;return}
  const el=document.elementFromPoint(e.clientX,e.clientY),p=el&&el.closest&&el.closest('#map path');
  if(!p||p.classList.contains('off')){tip.style.opacity=0;return}
  const r=$('mapbox').getBoundingClientRect(),d=byCode[p.dataset.c];
  tip.textContent=`${d.c} · ${d.n}`;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.style.opacity=1;
}

// glisser la carte à jouer sur la carte de France
let drag=null;
$('token').addEventListener('pointerdown',e=>{
  if(done)return;e.preventDefault();
  drag={x:e.clientX,y:e.clientY,el:null,over:null};$('token').setPointerCapture(e.pointerId);
});
$('token').addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.el&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6){
    drag.el=document.createElement('div');drag.el.className='ghostchip';
    drag.el.innerHTML=`<div class="ico" style="background:${getComputedStyle($('ico')).backgroundColor}">${icon(cur.t)}</div><span>${cur.n}</span>`;document.body.appendChild(drag.el)}
  if(drag.el){drag.el.style.left=e.clientX+'px';drag.el.style.top=e.clientY+'px';
    const el=document.elementFromPoint(e.clientX,e.clientY),p=el&&el.closest&&el.closest('#map path');
    const c=p&&!p.classList.contains('off')?p.dataset.c:null;
    if(c!==drag.over){drag.over&&$('p'+drag.over)?.classList.remove('drop');c&&$('p'+c).classList.add('drop');drag.over=c}}
});
const endDrag=e=>{if(!drag)return;const d=drag;drag=null;d.el?.remove();if(d.over){$('p'+d.over).classList.remove('drop');if(e.type==='pointerup')answer(d.over)}};
$('token').addEventListener('pointerup',endDrag);$('token').addEventListener('pointercancel',endDrag);

// ---------- partie ----------
function pool(){return CARDS.filter(c=>er==='all'||c.e===er)}
function newGame(){
  let p=pool(),fresh=p.filter(c=>!seen.has(c.id));
  if(fresh.length<10){p.forEach(c=>seen.delete(c.id));fresh=p}
  // pas deux cartes du même département dans une partie
  const used=new Set();game=[];for(const c of shuffle(fresh.slice())){if(used.has(c.c))continue;used.add(c.c);game.push(c);if(game.length===10)break}
  game.forEach(c=>seen.add(c.id));store('qeo-seen',[...seen]);
  idx=0;score=0;results=[];$('end').hidden=true;$('play').hidden=false;stats();newCard();
}
function stats(){$('sScore').textContent=score;$('sBest').textContent=best}
function paintMap(){
  DEPS.forEach(d=>{const p=$('p'+d.c);p.classList.remove('off','cand','good','miss','near','drop');
    if(allowed&&!allowed.has(d.c))p.classList.add('off');if(lv===1&&cands.includes(d.c)&&!done)p.classList.add('cand')});
}
// Photo de la carte (Wikimedia Commons, licences libres) avec son crédit ; voir qui-est-ou/credits.html
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function photoOf(c){return (window.QEO_IMAGES||{})[c.c+'|'+c.n]}
function showPhoto(c){
  const f=$('cphoto'),im=$('cphotoImg'),p=photoOf(c);
  if(!p){f.hidden=true;return}
  const [src,auteur,lic,licUrl,source,repere,type]=p;
  f.hidden=false;f.classList.remove('portrait');
  im.onload=()=>{f.classList.toggle('portrait',im.naturalHeight>im.naturalWidth*1.05)};
  im.src=src;im.alt=type==='Visuel du sujet'?c.n:(repere||c.n);
  const what=type&&type!=='Visuel du sujet'&&repere?esc(repere)+' · ':'';
  $('cphotoCap').innerHTML=`${what}Photo : <a href="${esc(source)}" target="_blank" rel="noopener">${esc(auteur)}</a>, <a href="${esc(licUrl)}" target="_blank" rel="noopener">${esc(lic)}</a> · <a href="qui-est-ou/credits.html" target="_blank">Crédits</a>`;
  const nx=game[idx+1]&&photoOf(game[idx+1]);if(nx){const i=new Image();i.src=nx[0]}
}
function newCard(){
  cur=game[idx];tries=0;done=false;labels=[];
  $('nCard').textContent=`Carte ${idx+1} / ${game.length}`;$('bar').style.width=(idx/game.length*100)+'%';
  $('token').className='token pop t-'+cur.t;$('ico').innerHTML=icon(cur.t);showPhoto(cur);
  $('kind').innerHTML=`<span>${TYPES[cur.t][0]}</span>${cur.e==='a'?'<span class="now">Aujourd\'hui</span>':''}`;
  $('title').textContent=cur.n;$('hint').textContent=cur.q;
  $('explain').hidden=true;$('next').hidden=true;$('giveup').hidden=false;$('dragHelp').hidden=false;
  if(lv===1){// trois départements proches les uns des autres, pour que la carte zoome bien
    const nb=shuffle(byCode[cur.c].v.slice());const second=nb[0];
    const ring=shuffle([...new Set([...nb.slice(1),...byCode[second].v])].filter(c=>c!==cur.c&&c!==second));
    cands=[cur.c,second,ring[0]].filter(c=>c&&byCode[c]);
    // Corse et départements isolés : pas assez de voisins, on complète avec les plus proches sur la carte
    if(cands.length<3){const mid=d=>[(d.b[0]+d.b[2])/2,(d.b[1]+d.b[3])/2],m=mid(byCode[cur.c]);
      DEPS.filter(d=>!cands.includes(d.c)).map(d=>[d.c,Math.hypot(mid(d)[0]-m[0],mid(d)[1]-m[1])]).sort((x,y)=>x[1]-y[1]).slice(0,3-cands.length).forEach(([c])=>cands.push(c))}
    cands=shuffle(cands);allowed=new Set(cands);
    say(`Trois départements en jaune : lequel est le bon ?`);setVB(box(cands,.45))}
  else if(lv===2){cands=[];allowed=new Set(REG[regOf[cur.c]]);say(`Indice : c'est en ${regOf[cur.c]}.`);setVB(box([...allowed],.12))}
  else{cands=[];allowed=null;say('');setVB([0,0,1000,965])}
  paintMap();drawLabels();
}
function say(t,c=''){const m=$('msg');m.textContent=t;m.className='msg '+c}
function answer(c){
  if(done||!cur||(allowed&&!allowed.has(c)))return;
  const d=byCode[c],good=byCode[cur.c];
  if(c===cur.c){const pts=lv===3?3:tries?1:lv;score+=pts;finish('ok',pts);return}
  tries++;$('p'+c).classList.add('miss');labels.push([c,d.n]);drawLabels();
  if(lv===3){if(good.v.includes(c)){score+=1;finish('near',1,d)}else finish('no',0,d);return}
  if(tries<2){snd('no');say(`Non, pas ${d.n}. Encore un essai !`,'no');const t=$('token');t.classList.remove('shake');void t.offsetWidth;t.classList.add('shake');
    allowed.delete(c);return}
  finish('no',0,d);
}
function finish(kind,pts,wrongD){
  done=true;const g=byCode[cur.c];
  $('p'+cur.c).classList.remove('off','cand');$('p'+cur.c).classList.add('good');
  if(kind==='near')$('p'+wrongD.c).classList.replace('miss','near');
  labels=labels.filter(([c])=>c!==cur.c);labels.push([cur.c,`${g.c} · ${g.n}`]);
  if(lv===3)setVB(box([cur.c,...(wrongD?[wrongD.c]:[])],.6));
  drawLabels();
  if(kind==='ok'){snd('place');say(`Bravo ! C'est bien ${g.n}. +${pts} point${pts>1?'s':''}`,'ok')}
  else if(kind==='near'){snd('no');say(`Presque ! ${wrongD.n} est voisin de ${g.n}. +1 point`,'near')}
  else if(kind==='giveup'){say(`C'était ${g.n} (${g.c}).`,'no')}
  else{snd('no');say(`Raté, c'était ${g.n} (${g.c}).`,'no')}
  results.push({card:cur,kind,pts});
  $('explain').textContent=cur.a;$('explain').hidden=false;$('giveup').hidden=true;$('dragHelp').hidden=true;
  $('next').hidden=false;$('next').textContent=idx<game.length-1?'Carte suivante':'Voir le résultat';
  $('bar').style.width=((idx+1)/game.length*100)+'%';stats();$('next').focus({preventScroll:true});
}
function endGame(){
  const max=game.length*(lv===3?3:lv);
  if(score>best){best=score;store('qeo-best',best)}
  stats();snd('win');
  mm('eureka',score>=max*.7?'Quelle culture ! Vous connaissez la France sur le bout des doigts.':'Belle partie ! Chaque carte vous a appris quelque chose.',6000);
  $('play').hidden=true;const e=$('end');e.hidden=false;
  e.innerHTML=`<h2>${score} point${score>1?'s':''} sur ${max}</h2><p class="help">Les cartes de la partie :</p><ol>${results.map(r=>{const g=byCode[r.card.c];
    return `<li><b>${r.card.n}</b> <span class="${r.kind==='ok'?'ok':r.kind==='near'?'nr':'no'}">${r.kind==='ok'?'✓':r.kind==='near'?'≈':'✗'}</span><br><span class="r">${g.n} (${g.c})</span></li>`}).join('')}</ol>
    <div class="actions"><button class="btn primary" id="again" type="button">Nouvelle partie</button></div>`;
  $('again').onclick=newGame;allowed=null;cands=[];labels=[];paintMap();setVB([0,0,1000,965]);
}
$('next').onclick=()=>{if(idx<game.length-1){idx++;newCard()}else endGame()};
$('giveup').onclick=()=>{if(!done)finish('giveup',0)};
function setOpt(row,attr,val){row.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===String(val)))}
$('lvRow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lv=+b.dataset.lv;store('qeo-lv',lv);setOpt($('lvRow'),'lv',lv);$('lvHelp').textContent=LV_HELP[lv];newGame()});
$('erRow').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;er=b.dataset.er;store('qeo-er',er);setOpt($('erRow'),'er',er);newGame()});
setOpt($('lvRow'),'lv',lv);setOpt($('erRow'),'er',er);$('lvHelp').textContent=LV_HELP[lv];
newGame();
setTimeout(()=>mm('jouer','Un monument, un personnage, un événement… À vous de le placer sur la carte de France !',7000),400);
}
</script>
